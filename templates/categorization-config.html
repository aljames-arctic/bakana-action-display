<div class="bad-categorization-config">
    <!-- Enable Toggle and Add Category Button -->
    <div class="bad-config-header-row">
        <div class="bad-config-toggle-group">
            <label class="bad-config-toggle-label">
                <input type="checkbox" name="categorizationEnabled" class="bad-config-enable-checkbox" data-action="toggleEnabled" {{#if config.enabled}}checked{{/if}} />
                <span>{{localize "BAD.categorization.enable"}}</span>
            </label>
            <i class="fas fa-circle-question bad-config-help-icon" data-tooltip="{{localize 'BAD.categorization.expressionHelpTooltip'}}" data-tooltip-direction="RIGHT"></i>
        </div>
        <button type="button" class="bad-config-btn bad-config-btn-primary" data-action="addCategory">
            <i class="fas fa-plus"></i> {{localize "BAD.categorization.addCategory"}}
        </button>
    </div>

    <!-- Category list -->
    <div class="bad-config-categories-list">
        {{#if config.categories.length}}
            {{#each config.categories as |cat catIndex|}}
            <div class="bad-config-cat-card" data-cat-index="{{catIndex}}" data-cat-id="{{cat.id}}">
                <!-- Top-Level Category Row: [ Grip ] [ + Subitem ] [ Name ] [ Expression ] [ Fallthrough ] [ Delete ] -->
                <div class="bad-config-cat-row" data-cat-index="{{catIndex}}" data-cat-id="{{cat.id}}">
                    <div class="bad-config-drag-handle" data-drag-type="category" data-cat-index="{{catIndex}}">
                        <i class="fas fa-grip-vertical"></i>
                    </div>
                    <button type="button" class="bad-config-btn" data-action="addSubCategory" data-cat-index="{{catIndex}}">
                        <i class="fas fa-plus"></i>
                    </button>
                    <input type="text" class="bad-cat-name-input" data-cat-index="{{catIndex}}" value="{{cat.name}}" placeholder="{{localize 'BAD.categorization.categoryNamePlaceholder'}}" />
                    <input type="text" class="bad-cat-expr-input" data-cat-index="{{catIndex}}" value="{{cat.expression}}" placeholder="{{localize 'BAD.categorization.categoryExprPlaceholder'}}" />
                    <button type="button" class="bad-config-btn bad-config-btn-fallthrough {{#if cat.fallthrough}}active{{/if}}" data-action="toggleFallthrough" data-cat-index="{{catIndex}}" data-tooltip="{{localize 'BAD.categorization.fallthroughTooltip'}}" data-tooltip-direction="UP">
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <button type="button" class="bad-config-btn bad-config-btn-danger" data-action="removeCategory" data-cat-index="{{catIndex}}">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>

                <!-- Subcategories List -->
                {{#if cat.subcategories.length}}
                <div class="bad-config-subcategories-list">
                    {{#each cat.subcategories as |sub subIndex|}}
                    <div class="bad-config-sub-row" data-cat-index="{{catIndex}}" data-sub-index="{{subIndex}}" data-sub-id="{{sub.id}}">
                        <div class="bad-config-drag-handle" data-drag-type="subcategory" data-cat-index="{{catIndex}}" data-sub-index="{{subIndex}}">
                            <i class="fas fa-grip-vertical"></i>
                        </div>
                        <input type="text" class="bad-sub-name-input" data-cat-index="{{catIndex}}" data-sub-index="{{subIndex}}" value="{{sub.name}}" placeholder="{{localize 'BAD.categorization.subCategoryNamePlaceholder'}}" />
                        <input type="text" class="bad-sub-expr-input" data-cat-index="{{catIndex}}" data-sub-index="{{subIndex}}" value="{{sub.expression}}" placeholder="{{localize 'BAD.categorization.subCategoryExprPlaceholder'}}" />
                        <button type="button" class="bad-config-btn bad-config-btn-danger" data-action="removeSubCategory" data-cat-index="{{catIndex}}" data-sub-index="{{subIndex}}">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                    {{/each}}
                </div>
                {{/if}}
            </div>
            {{/each}}
        {{else}}
            <div class="bad-config-empty-state">
                <i class="fas fa-layer-group"></i>
                <p>{{localize "BAD.categorization.noCategories"}}</p>
            </div>
        {{/if}}
    </div>

    <!-- Footer Controls -->
    <div class="bad-config-footer">
        <button type="button" class="bad-config-btn" data-action="loadPresets">
            <i class="fas fa-wand-magic-sparkles"></i> {{localize "BAD.categorization.loadPresets"}}
        </button>
        <div class="bad-config-footer-actions">
            <button type="button" class="bad-config-btn" data-action="closeConfig">
                <i class="fas fa-times"></i> {{localize "BAD.categorization.cancel"}}
            </button>
            <button type="button" class="bad-config-btn bad-config-btn-primary" data-action="saveConfig">
                <i class="fas fa-save"></i> {{localize "BAD.categorization.save"}}
            </button>
        </div>
    </div>
</div>
